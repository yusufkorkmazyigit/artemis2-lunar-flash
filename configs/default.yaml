# Paths and parameters. Values marked TODO are filled in once verified from the Data User Guide.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed

eclipse:
  # PROVISIONAL (2026-11-04). Secondary sources give the eclipse as 01:35-02:32 UTC on
  # 2026-04-07 (Wikipedia) and ~54 min long (NASA preliminary report); NASA's simulated
  # eclipse image is captioned 2026-04-07 01:04 UTC. Real labels show flight day 6 still
  # running at 01:04 UTC (art002e009300, Z9, 6 s @ ISO 1600) and flight day 7 by 21:37 UTC.
  # Window is widened to cover both readings until the eclipse frames are identified.
  flight_day: 6           # crew_camera/data_*/fd06 (flight day != UTC date)
  start_utc: "2026-04-07T00:30:00Z"   # provisional, widened
  stop_utc: "2026-04-07T03:00:00Z"    # provisional, widened
  verified: false

alignment:
  window_seconds: 60      # utterance <-> frame matching window (+/-)

download:
  max_requests_per_second: 2
  verify_checksums: true
